<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPC Finder</title>
    <style>
      body {
        width: 200px;
        padding: 10px;
        font-family: Arial, sans-serif;
      }
      #upc {
        font-size: 16px;
        margin-bottom: 10px;
      }
      #copy-btn {
        background-color: #4caf50;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
      }
      #copy-btn:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div id="upc"></div>
    <button id="copy-btn">Copy UPC</button>

    <script src="popup.js"></script>
  </body>
</html>
